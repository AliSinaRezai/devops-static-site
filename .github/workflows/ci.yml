name: Static Website CI

on:
  push:
    branches:
      - master
      - feature-ui
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-static-site .

      - name: Check project files
        run: |
          test -f index.html
          test -f tasks.html
          test -f about.html
          test -f style.css
          test -f script.js
          test -f Dockerfile